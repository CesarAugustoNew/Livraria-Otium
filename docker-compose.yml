# Sobe apenas o PostgreSQL para desenvolvimento local.
services:
  db:
    image: postgres:17
    container_name: otium-db
    environment:
      POSTGRES_DB: otium
      POSTGRES_USER: otium
      POSTGRES_PASSWORD: otium
    ports:
      # 5433 no host para não colidir com um PostgreSQL instalado localmente na 5432
      - "5433:5432"
    volumes:
      - otium-db-data:/var/lib/postgresql/data

volumes:
  otium-db-data:

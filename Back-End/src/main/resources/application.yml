spring:
  application:
    name: livraria-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/otium}
    username: ${DB_USER:otium}
    password: ${DB_PASSWORD:otium}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # schema das tabelas; num Postgres compartilhado entre projetos, cada um usa o seu (ex.: livraria_otium)
        default_schema: ${DB_SCHEMA:public}
      jakarta:
        persistence:
          # cria o schema na primeira subida se ele ainda não existir
          create-database-schemas: true

server:
  # o Render informa a porta pela variável PORT
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

app:
  jwt:
    # Em produção defina JWT_SECRET (mínimo 32 caracteres). O valor abaixo é só para desenvolvimento.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    # cria admin, banners e catálogo quando o banco está vazio
    enabled: ${SEED_ENABLED:true}
    admin-email: ${ADMIN_EMAIL:admin@otium.com}
    admin-password: ${ADMIN_PASSWORD:admin12345}
  # API pública de livros (sem chave). Fornece os dados bibliográficos; preço e estoque são da loja.
  open-library:
    base-url: ${OPEN_LIBRARY_URL:https://openlibrary.org}
    connect-timeout: 5s
    read-timeout: 20s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
